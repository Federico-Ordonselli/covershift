name: Setup
description: pnpm (version from package.json, store cached), Node from .nvmrc, frozen install, shared package build.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false # pnpm/action-setup caches the store
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build shared contracts (consumed as dist by the API)
      shell: bash
      run: pnpm --filter @covershift/shared build
