version: 2
updates:
  - package-ecosystem: npm # pnpm workspace: root lockfile covers apps/* and packages/*
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Groups must not overlap: Dependabot assigns a dependency to the group it deems most
    # specific, NOT the first one listed (a pattern-less group won @nestjs/* in practice).
    groups:
      # Nest packages must move together (11 -> 12 is one migration, see README
      # "Tech choices"), so majors are grouped too instead of one PR per package.
      nestjs:
        patterns: ['@nestjs/*']
        update-types: [major, minor, patch]
      minor-and-patch:
        exclude-patterns: ['@nestjs/*'] # owned by the nestjs group above
        update-types: [minor, patch]
    # Majors outside the groups (e.g. TypeScript 6) stay one PR each, reviewed on their own.
    ignore:
      # Types must match the runtime: @types/node's major tracks .nvmrc (24). Bump both
      # together by hand when Node moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)

  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)

  # Digest-pinned base images in the API Dockerfile.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The build stage (node:*) must match the runtime major (distroless/nodejs24-*, whose
      # major is in the image name, so Dependabot never bumps it). Move both by hand,
      # together with .nvmrc and @types/node.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
