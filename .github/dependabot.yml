version: 2
updates:
  - package-ecosystem: npm # pnpm workspace: root lockfile covers apps/* and packages/*
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)

  # Docker and Terraform ecosystems are added in phase 4 (infra/).
