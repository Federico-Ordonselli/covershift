version: 2
updates:
  - package-ecosystem: npm # pnpm workspace: root lockfile covers apps/* and packages/*
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A dependency joins the FIRST group that matches, so order matters.
    groups:
      # Nest packages must move together (11 -> 12 is one migration, see README
      # "Tech choices"), so majors are grouped too instead of one PR per package.
      nestjs:
        patterns: ['@nestjs/*']
        update-types: [major, minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
    # Majors outside the groups (e.g. TypeScript 6) stay one PR each, reviewed on their own.
    ignore:
      # Types must match the runtime: @types/node's major tracks .nvmrc (24). Bump both
      # together by hand when Node moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)

  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)

  # Docker and Terraform ecosystems are added in phase 4 (infra/).
