name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly, Monday 05:17 UTC: CodeQL with new queries, audit against new advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results; only this job may
      actions: read # read workflow run metadata (needed on private repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  # Advisories appear without code changes, so the per-PR audit in ci.yml isn't enough.
  # Gates nothing; a red scheduled run is the notification.
  scheduled-audit:
    name: Weekly dependency audit
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: All dependencies, any severity (report)
        continue-on-error: true
        run: pnpm audit | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Production dependencies, high and critical (fails the run)
        run: pnpm audit --prod --audit-level=high
